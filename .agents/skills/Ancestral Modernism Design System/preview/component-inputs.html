<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--background); }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .field { display:flex; flex-direction:column; gap: 6px; }
  .label { font-family: var(--font-body); font-weight: 600; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--primary); }
  .input {
    font-family: var(--font-body); font-size: 15px; color: var(--on-surface);
    background: var(--surface-container-highest);
    border: 0; border-radius: var(--radius-md);
    padding: 12px 14px;
    border-bottom: 2px solid transparent;
    transition: border-color 200ms cubic-bezier(0.22, 0.61, 0.36, 1);
    outline: none;
  }
  .input::placeholder { color: var(--on-surface-muted); }
  .input.focused { border-bottom-color: var(--primary); }
  .helper { font-family: var(--font-body); font-size: 12px; color: var(--on-surface-variant); }
  textarea.input { resize: none; min-height: 56px; line-height: 1.5; }
</style></head>
<body>
  <div class="grid">
    <div class="field">
      <div class="label">Tu nombre</div>
      <input class="input" value="Carla León" />
      <div class="helper">Aparecerá en tu perfil del barrio.</div>
    </div>
    <div class="field">
      <div class="label">Barrio</div>
      <input class="input focused" value="El Vado" />
      <div class="helper" style="color:var(--primary)">Estado : enfocado · borde inferior animado</div>
    </div>
    <div class="field" style="grid-column: span 2;">
      <div class="label">¿Qué circulas?</div>
      <textarea class="input" placeholder="Una bicicleta antigua, herramientas de carpintería..."></textarea>
    </div>
  </div>
</body></html>
