<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Primary · Rojo Tierra</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--background); }
  .row { display:grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap:14px; align-items:stretch; }
  .swatch { border-radius: var(--radius-md); padding: 16px; min-height: 110px; display:flex; flex-direction:column; justify-content: space-between; }
  .swatch .name { font-family: var(--font-display); font-weight:600; font-size:15px; letter-spacing:-0.005em; }
  .swatch .hex { font-family: var(--font-mono); font-size: 11px; opacity:0.85; }
  .swatch .role { font-family: var(--font-body); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.7; }
  .gradient { background: var(--gradient-primary); color: var(--on-primary); }
  .container { background: var(--primary-container); color: var(--on-primary-container); }
</style></head>
<body>
  <div class="row">
    <div class="swatch" style="background: var(--primary); color: var(--on-primary); grid-row: span 1;">
      <div class="role">Primary · Rojo Tierra</div>
      <div>
        <div class="name">primary</div>
        <div class="hex">#A63A2F</div>
      </div>
    </div>
    <div class="swatch" style="background: var(--primary-deep); color: var(--on-primary);">
      <div class="role">Pressed / Gradient</div>
      <div>
        <div class="name">primary-deep</div>
        <div class="hex">#86231A</div>
      </div>
    </div>
    <div class="swatch gradient">
      <div class="role">CTA gradient</div>
      <div>
        <div class="name">gradient-primary</div>
        <div class="hex">86231A → A63A2F</div>
      </div>
    </div>
    <div class="swatch container">
      <div class="role">Tonal fill</div>
      <div>
        <div class="name">primary-container</div>
        <div class="hex">#F2D9D5</div>
      </div>
    </div>
  </div>
</body></html>
