<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Elevation · Soil shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:32px 24px; background: var(--background); }
  .row { display:grid; grid-template-columns: repeat(4, 1fr); gap: 18px; align-items: end; }
  .card { background: var(--surface-container-lowest); border-radius: var(--radius-md); padding: 14px; min-height: 90px; display:flex; flex-direction:column; justify-content: space-between; }
  .name { font-family: var(--font-display); font-weight: 600; font-size: 13px; color: var(--on-surface); }
  .role { font-family: var(--font-body); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--primary); font-weight: 600; margin-bottom: 6px; }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--on-surface-muted); }
  .a { box-shadow: none; }
  .b { box-shadow: 0 6px 14px rgba(134, 35, 26, 0.04); }
  .c { box-shadow: 0 20px 40px rgba(134, 35, 26, 0.05); }
  .d { box-shadow: 0 28px 60px rgba(134, 35, 26, 0.08); }
</style></head>
<body>
  <div class="row">
    <div class="card a"><div><div class="role">Rest</div><div class="name">flat</div></div><div class="px">no shadow</div></div>
    <div class="card b"><div><div class="role">Press / hover</div><div class="name">shadow-soil-sm</div></div><div class="px">0 6 14 · 4%</div></div>
    <div class="card c"><div><div class="role">Floating</div><div class="name">shadow-soil</div></div><div class="px">0 20 40 · 5%</div></div>
    <div class="card d"><div><div class="role">Modal · top</div><div class="name">shadow-soil-lg</div></div><div class="px">0 28 60 · 8%</div></div>
  </div>
  <p style="font-family:var(--font-body);font-size:12px;color:var(--on-surface-variant);margin:18px 0 0;">All shadows use <code style="font-family:var(--font-mono);font-size:11px;background:var(--surface-container-highest);padding:1px 6px;border-radius:4px">rgba(134,35,26,…)</code> — primary red at low alpha, never cool grey.</p>
</body></html>
