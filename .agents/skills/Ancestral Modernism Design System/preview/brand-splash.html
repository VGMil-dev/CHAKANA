<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Splash · canonical hero</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:0; background: var(--background); display:flex; align-items:center; gap: 24px; padding: 18px 24px; }
  .splash { height: 320px; aspect-ratio: 390/844; background-image: url('../assets/chakana-splash.png'); background-size: cover; background-position: center; border-radius: var(--radius-md); flex: 0 0 auto; }
  .notes { display:flex; flex-direction:column; gap: 12px; max-width: 380px; }
  .eyebrow { font-family: var(--font-body); font-weight: 600; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--primary); }
  .head { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.2; color: var(--on-surface); margin: 0; letter-spacing: -0.01em; }
  .body { font-family: var(--font-body); font-size: 13px; line-height: 1.6; color: var(--on-surface-variant); margin: 0; }
  .body em { font-style: normal; color: var(--primary); font-weight: 500; }
</style></head>
<body>
  <div class="splash"></div>
  <div class="notes">
    <div class="eyebrow">REFERENCE · SPLASH</div>
    <h3 class="head">Aquí tu apoyo vuelve.</h3>
    <p class="body">The original product splash. Mark, wordmark "<em>CHAKANA</em>", subtitle "<em>Ecosistema de Economía Circular</em>", hero line "<em>Aquí tu apoyo vuelve</em>", stamp "<em>· CUENCA, ECUADOR ·</em>", and footer "<em>REACTIVANDO LA ATENAS</em>" — the canonical composition.</p>
  </div>
</body></html>
