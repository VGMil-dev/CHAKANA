<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Logo · Chakana mark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--background); }
  .row { display:grid; grid-template-columns: 160px 1fr; gap: 28px; align-items:center; }
  .logo-wrap { display:flex; align-items:center; justify-content:center; aspect-ratio: 1/1; background: var(--surface); border-radius: var(--radius-md); padding: 18px; }
  .logo-wrap img { width: 100%; height: auto; display:block; }
  .lockup { display:flex; flex-direction:column; gap: 14px; }
  .wordmark { font-family: var(--font-display); font-weight: 700; font-size: 34px; letter-spacing: 0.32em; color: var(--on-surface); margin-left: 4px; }
  .subtitle { font-family: var(--font-body); font-weight: 500; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--on-surface-variant); }
  .stamp { font-family: var(--font-body); font-weight: 600; font-size: 11px; letter-spacing: 0.20em; text-transform: uppercase; color: var(--primary); }
</style></head>
<body>
  <div class="row">
    <div class="logo-wrap"><img src="../assets/logo.png" alt="Chakana mark"></div>
    <div class="lockup">
      <div class="wordmark">CHAKANA</div>
      <div class="subtitle">Ecosistema de Economía Circular</div>
      <div class="stamp" style="margin-top: 6px;">· CUENCA, ECUADOR ·</div>
    </div>
  </div>
</body></html>
