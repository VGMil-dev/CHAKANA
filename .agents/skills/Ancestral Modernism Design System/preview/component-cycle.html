<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Cycle indicator</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:32px 24px; background: var(--background); }
  .cycle { display:grid; grid-template-columns: repeat(4, 1fr); gap: 0; align-items:center; position: relative; }
  .step { display:flex; flex-direction:column; align-items:center; gap: 10px; position: relative; }
  .dot {
    width: 28px; height: 28px; border-radius: 999px;
    background: var(--surface-container-highest);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-body); font-weight: 600; font-size: 11px; color: var(--on-surface-muted);
    border: 3px solid var(--background);
    z-index: 2;
  }
  .step.done .dot { background: var(--secondary); color: var(--on-secondary); }
  .step.current .dot { background: var(--secondary-container); color: var(--secondary-deep); box-shadow: 0 0 0 4px rgba(58,175,169,0.18); }
  .label { font-family: var(--font-body); font-weight: 500; font-size: 12px; color: var(--on-surface); }
  .step.done .label { color: var(--secondary-deep); }
  .step.todo .label { color: var(--on-surface-muted); }
  .track {
    position: absolute; top: 14px; left: 12.5%; right: 12.5%; height: 3px;
    background: var(--surface-container-highest); z-index: 1; border-radius: 2px;
  }
  .track .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; background: var(--secondary); border-radius: 2px; }
  .heading { font-family: var(--font-body); font-weight: 600; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--primary); margin-bottom: 18px; }
</style></head>
<body>
  <div class="heading">CICLO · ESTADO DE TU DONACIÓN</div>
  <div class="cycle">
    <div class="track"><div class="fill"></div></div>
    <div class="step done"><div class="dot">✓</div><div class="label">Donado</div></div>
    <div class="step done"><div class="dot">✓</div><div class="label">Recolectado</div></div>
    <div class="step current"><div class="dot">3</div><div class="label">Restaurado</div></div>
    <div class="step todo"><div class="dot">4</div><div class="label">Devuelto</div></div>
  </div>
</body></html>
