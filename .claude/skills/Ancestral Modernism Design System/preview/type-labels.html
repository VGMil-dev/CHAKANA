<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Labels & eyebrows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--background); }
  .row { display:flex; flex-direction: column; gap: 18px; }
  .item { display:grid; grid-template-columns: 1fr auto; gap: 20px; align-items: baseline; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--on-surface-muted); white-space: nowrap; text-align: right; }
  .meta b { color: var(--primary); font-weight: 600; }
  .l-lg { font-family: var(--font-body); font-weight:500; font-size: 0.8125rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--on-surface-variant); }
  .l-md { font-family: var(--font-body); font-weight:600; font-size: 0.6875rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--primary); }
  .l-sm { font-family: var(--font-body); font-weight:600; font-size: 0.625rem; letter-spacing: 0.20em; text-transform: uppercase; color: var(--on-surface-muted); }
  .stamp { font-family: var(--font-body); font-weight:600; font-size: 0.6875rem; letter-spacing: 0.20em; text-transform: uppercase; color: var(--on-surface-variant); }
</style></head>
<body>
  <div class="row">
    <div class="item">
      <div class="l-lg">REACTIVANDO LA ATENAS</div>
      <div class="meta"><b>label-lg</b><br>Inter 500 · 13 · +0.14em</div>
    </div>
    <div class="item">
      <div class="l-md">01 · MERCADO</div>
      <div class="meta"><b>label-md / eyebrow</b><br>Inter 600 · 11 · +0.18em · primary</div>
    </div>
    <div class="item">
      <div class="stamp">· CUENCA, ECUADOR ·</div>
      <div class="meta"><b>place stamp</b><br>Inter 600 · 11 · +0.20em</div>
    </div>
    <div class="item">
      <div class="l-sm">DONACIÓN ACEPTADA</div>
      <div class="meta"><b>label-sm</b><br>Inter 600 · 10 · +0.20em</div>
    </div>
  </div>
</body></html>
