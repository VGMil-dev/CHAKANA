<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--background); font-family: var(--font-body); }
  .row { display:flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .row + .row { margin-top: 16px; }
  .btn {
    font-family: var(--font-body); font-weight: 500; font-size: 14px;
    padding: 12px 22px; border-radius: var(--radius-md); border: 0;
    cursor: pointer; transition: all 200ms cubic-bezier(0.22, 0.61, 0.36, 1);
    letter-spacing: 0; line-height: 1;
  }
  .btn-primary { background: var(--gradient-primary); color: var(--on-primary); }
  .btn-primary:hover { box-shadow: 0 6px 14px rgba(134, 35, 26, 0.04); transform: translateY(-1px); background: var(--gradient-primary-hover); }
  .btn-secondary { background: transparent; color: var(--on-surface); box-shadow: inset 0 0 0 1px var(--outline-variant); }
  .btn-secondary:hover { box-shadow: inset 0 0 0 1px rgba(140, 133, 123, 0.3); }
  .btn-ghost { background: transparent; color: var(--primary); padding-left: 10px; padding-right: 10px; }
  .btn-ghost:hover { color: var(--primary-deep); background: var(--primary-container); }
  .btn-sm { padding: 8px 14px; font-size: 13px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--on-surface-muted); letter-spacing: 0.18em; text-transform: uppercase; min-width: 78px; }
</style></head>
<body>
  <div class="row">
    <div class="lbl">Primary</div>
    <button class="btn btn-primary">Sumarse</button>
    <button class="btn btn-primary">Ver mercado →</button>
    <button class="btn btn-primary btn-sm">Donar</button>
  </div>
  <div class="row">
    <div class="lbl">Secondary</div>
    <button class="btn btn-secondary">Empezar a circular</button>
    <button class="btn btn-secondary btn-sm">Más detalles</button>
  </div>
  <div class="row">
    <div class="lbl">Ghost</div>
    <button class="btn btn-ghost">Cancelar</button>
    <button class="btn btn-ghost">Ver todos →</button>
  </div>
</body></html>
