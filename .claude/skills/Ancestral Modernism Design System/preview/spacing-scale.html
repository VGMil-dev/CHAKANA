<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--background); }
  .scale { display:flex; flex-direction:column; gap: 6px; }
  .row { display:grid; grid-template-columns: 80px 1fr 60px; gap: 12px; align-items:center; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--on-surface-variant); }
  .bar { height: 12px; background: var(--primary); border-radius: 2px; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--on-surface-muted); text-align: right; }
</style></head>
<body>
  <div class="scale">
    <div class="row"><div class="name">space-1</div><div><div class="bar" style="width:4px"></div></div><div class="px">4 px</div></div>
    <div class="row"><div class="name">space-2</div><div><div class="bar" style="width:8px"></div></div><div class="px">8 px</div></div>
    <div class="row"><div class="name">space-3</div><div><div class="bar" style="width:12px"></div></div><div class="px">12 px</div></div>
    <div class="row"><div class="name">space-4</div><div><div class="bar" style="width:16px"></div></div><div class="px">16 px</div></div>
    <div class="row"><div class="name">space-5</div><div><div class="bar" style="width:20px"></div></div><div class="px">20 px</div></div>
    <div class="row"><div class="name">space-6</div><div><div class="bar" style="width:24px"></div></div><div class="px">24 px</div></div>
    <div class="row"><div class="name">space-8</div><div><div class="bar" style="width:32px"></div></div><div class="px">32 px</div></div>
    <div class="row"><div class="name">space-10</div><div><div class="bar" style="width:40px"></div></div><div class="px">40 px</div></div>
    <div class="row"><div class="name">space-12</div><div><div class="bar" style="width:48px"></div></div><div class="px">48 px</div></div>
    <div class="row"><div class="name">space-16</div><div><div class="bar" style="width:64px"></div></div><div class="px">64 px</div></div>
    <div class="row"><div class="name">space-20</div><div><div class="bar" style="width:80px"></div></div><div class="px">80 px</div></div>
    <div class="row"><div class="name">space-24</div><div><div class="bar" style="width:96px"></div></div><div class="px">96 px</div></div>
  </div>
</body></html>
