<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Radius scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--background); }
  .row { display:flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
  .item { display:flex; flex-direction:column; gap: 6px; align-items:center; }
  .swatch { width: 90px; height: 64px; background: var(--primary); }
  .swatch.canon { background: var(--primary); outline: 2px dashed var(--primary-deep); outline-offset: 4px; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--on-surface-variant); }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--on-surface-muted); }
  .note { margin-top: 12px; font-family: var(--font-body); font-size: 12px; color: var(--on-surface-variant); }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="swatch" style="border-radius:4px"></div><div class="name">radius-xs</div><div class="px">4 px</div></div>
    <div class="item"><div class="swatch" style="border-radius:6px"></div><div class="name">radius-sm</div><div class="px">6 px</div></div>
    <div class="item"><div class="swatch canon" style="border-radius:10px"></div><div class="name" style="color:var(--primary);font-weight:600;">radius-md</div><div class="px">10 px · canonical</div></div>
    <div class="item"><div class="swatch" style="border-radius:14px"></div><div class="name">radius-lg</div><div class="px">14 px</div></div>
    <div class="item"><div class="swatch" style="border-radius:20px"></div><div class="name">radius-xl</div><div class="px">20 px</div></div>
    <div class="item"><div class="swatch" style="border-radius:999px"></div><div class="name">radius-pill</div><div class="px">999 px</div></div>
  </div>
  <p class="note">10 px is the canonical radius — buttons, inputs, cards, modals, images. Pills only for chips, badges, the cycle indicator.</p>
</body></html>
