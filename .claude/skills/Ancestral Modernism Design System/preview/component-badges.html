<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Badges & chips</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--background); }
  .row { display:flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .row + .row { margin-top: 14px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--on-surface-muted); letter-spacing: 0.18em; text-transform: uppercase; min-width: 90px; }
  .chip {
    font-family: var(--font-body); font-weight: 500; font-size: 12px;
    padding: 6px 12px; border-radius: var(--radius-pill);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip-default { background: var(--surface-container-highest); color: var(--on-surface); }
  .chip-primary { background: var(--primary-container); color: var(--on-primary-container); }
  .chip-secondary { background: var(--secondary-container); color: var(--on-secondary-container); }
  .chip-solid { background: var(--primary); color: var(--on-primary); }
  .chip-ghost { background: transparent; color: var(--on-surface-variant); box-shadow: inset 0 0 0 1px var(--outline-variant); }
  .dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; }
  .stamp { font-family: var(--font-body); font-weight: 600; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--primary); }
</style></head>
<body>
  <div class="row"><div class="lbl">Filter chips</div>
    <span class="chip chip-default">Todo</span>
    <span class="chip chip-solid">Mercado</span>
    <span class="chip chip-default">Talleres</span>
    <span class="chip chip-default">Servicios</span>
    <span class="chip chip-default">Materiales</span>
  </div>
  <div class="row"><div class="lbl">Status badges</div>
    <span class="chip chip-secondary"><span class="dot"></span>Disponible</span>
    <span class="chip chip-primary"><span class="dot"></span>Reservado</span>
    <span class="chip chip-ghost"><span class="dot" style="background:var(--on-surface-muted)"></span>Pendiente</span>
  </div>
  <div class="row"><div class="lbl">Editorial tag</div>
    <span class="stamp">01 · MERCADO</span>
    <span class="stamp">· CUENCA, ECUADOR ·</span>
  </div>
</body></html>
