<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Type pairing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--background); }
  .pair { display:grid; grid-template-columns: 1.6fr 1fr; gap: 24px; align-items: end; }
  .display { font-family: var(--font-display); font-weight:700; font-size: 3rem; line-height: 1.05; letter-spacing: -0.02em; color: var(--on-surface); }
  .display .accent { color: var(--primary); }
  .side { padding-bottom: 6px; }
  .eyebrow { font-family: var(--font-body); font-weight: 600; font-size: 0.6875rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--primary); margin-bottom: 8px; }
  .desc { font-family: var(--font-body); font-weight: 400; font-size: 0.9375rem; line-height: 1.6; color: var(--on-background); margin: 0; }
</style></head>
<body>
  <div class="pair">
    <div class="display">Aquí tu <span class="accent">apoyo</span> vuelve.</div>
    <div class="side">
      <div class="eyebrow">02 · TALLERES</div>
      <p class="desc">Raleway display + Inter body, side by side. The editorial-magazine pairing.</p>
    </div>
  </div>
</body></html>
