<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Surface stack</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--background); }
  .stack { display:flex; flex-direction:column; gap:0; border-radius: var(--radius-md); overflow:hidden; }
  .tier { padding: 10px 16px; display:flex; justify-content: space-between; align-items: center; }
  .name { font-family: var(--font-display); font-weight:600; font-size:13px; color: var(--on-surface); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--on-surface-variant); }
  .role { font-family: var(--font-body); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--primary); font-weight: 600; }
</style></head>
<body>
  <div class="stack">
    <div class="tier" style="background: var(--background)">
      <div class="role">Page canvas</div>
      <div class="name">background · Crema</div>
      <div class="hex">#F5F0EB</div>
    </div>
    <div class="tier" style="background: var(--surface-container-low)">
      <div class="role">Section</div>
      <div class="name">surface-container-low</div>
      <div class="hex">#F8F3EE</div>
    </div>
    <div class="tier" style="background: var(--surface)">
      <div class="role">Elevated</div>
      <div class="name">surface · Blanco Cálido</div>
      <div class="hex">#FDFAF7</div>
    </div>
    <div class="tier" style="background: var(--surface-container-lowest)">
      <div class="role">Card</div>
      <div class="name">surface-container-lowest</div>
      <div class="hex">#FFFFFF</div>
    </div>
    <div class="tier" style="background: var(--surface-container-highest)">
      <div class="role">Input fill</div>
      <div class="name">surface-container-highest</div>
      <div class="hex">#E6E2DD</div>
    </div>
  </div>
</body></html>
