<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Glass surface</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:0; background: var(--background); }
  .frame { position: relative; height: 220px; overflow: hidden; }
  .bg {
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 20% 30%, #C97A3A 0%, transparent 38%),
      radial-gradient(circle at 80% 70%, var(--primary) 0%, transparent 45%),
      radial-gradient(circle at 60% 20%, var(--secondary) 0%, transparent 35%),
      var(--background);
    filter: saturate(0.85);
  }
  .glass {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 80%; padding: 18px 22px;
    background: rgba(253, 250, 247, 0.80);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: var(--radius-md);
    box-shadow: 0 12px 32px rgba(38, 26, 22, 0.08);
    display:flex; align-items:center; justify-content:space-between;
  }
  .glass .label { font-family: var(--font-display); font-weight:600; font-size: 16px; color: var(--on-surface); }
  .glass .meta { font-family: var(--font-mono); font-size: 11px; color: var(--on-surface-variant); }
</style></head>
<body>
  <div class="frame">
    <div class="bg"></div>
    <div class="glass">
      <div class="label">glass-bg + glass-blur</div>
      <div class="meta">surface @ 80% · backdrop-blur 12px</div>
    </div>
  </div>
</body></html>
